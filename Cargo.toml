[package]
name = "fluxpack"
version = "0.1.0"
edition = "2021"
authors = ["FluxPack Engineering <hi@fluxpack.io>"]
description = "A schema‑free, Shannon‑optimal serialisation format"
repository = "https://github.com/DawitDeVoe123/fluxpack"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
bytes = "1.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

#[[bench]]
#name = "benchmark"
#harness = false