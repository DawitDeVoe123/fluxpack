[package]
name = "fluxpack"
version = "0.4.0"
edition = "2021"
authors = ["FluxPack Engineering <hi@fluxpack.io>"]
description = "Schema-free, Shannon-optimal serialisation — faster and smaller than JSON for ML pipelines"
repository = "https://github.com/DawitDeVoe123/fluxpack"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lib]
name = "fluxpack"
crate-type = ["rlib"]

[features]
default = []
parallel = ["rayon"]
compression = ["zstd"]
python = ["pyo3"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
bytes = "1.5"
ahash = "0.8"
rayon = { version = "1.10", optional = true }
zstd = { version = "0.13", optional = true }
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "multi"
harness = false

[[bench]]
name = "perf"
harness = false

[[bench]]
name = "inline"
harness = false
